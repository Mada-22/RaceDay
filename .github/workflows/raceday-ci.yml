
name: RaceDay CI

on:
  push:
    branches:
      - main
      - feature/raceday-api-tests

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test RaceDayAPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore RaceDayAPI/RaceDayAPI.csproj

      - name: Build RaceDayAPI
        run: dotnet build RaceDayAPI/RaceDayAPI.csproj --configuration Release --no-restore

      - name: Restore test dependencies
        run: dotnet restore RaceDay.Tests/RaceDay.Tests.csproj

      - name: Run tests
        run: dotnet test RaceDay.Tests/RaceDay.Tests.csproj --configuration Release --no-restore


