

name: RaceDay Automated Tests

on:
  push:

  pull_request:

  workflow_dispatch:

jobs:
  test:
    name: Build and Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore RaceDayAPI.Tests/RaceDayAPI.Tests.csproj

      - name: Build and Run All Tests
        run: dotnet test RaceDayAPI.Tests/RaceDayAPI.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"


          

